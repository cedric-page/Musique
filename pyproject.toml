[project]
name = "musique-repet"
version = "0.1.0"
description = "Découpe, séparation de pistes, équilibrage et mixage MP3 d'enregistrements de répétition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "demucs>=4.0.1",
    "faster-whisper>=1.1",
    "lameenc>=1.7",
    "librosa>=0.11",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyloudnorm>=0.1.1",
    "rapidfuzz>=3.9",
    "scipy>=1.11",
    "shazamio>=0.9",
    "soundfile>=0.12",
    "torch>=2.5,<2.12",
    "torchaudio>=2.5,<2.12",
]

[project.scripts]
musique-repet = "musique_repet.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musique_repet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
